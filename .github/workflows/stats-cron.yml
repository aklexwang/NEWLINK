name: stats-cron

on:
  schedule:
    # UTC 18:05 = KST 03:05 (Render Free 기동 여유)
    - cron: '5 18 * * *'
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - name: POST /api/internal/stats/run 후 완료까지 대기
        env:
          NEWLINK_API_URL: ${{ secrets.NEWLINK_API_URL }}
          INTERNAL_CRON_TOKEN: ${{ secrets.INTERNAL_CRON_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NEWLINK_API_URL}" ] || [ -z "${INTERNAL_CRON_TOKEN}" ]; then
            echo "NEWLINK_API_URL 또는 INTERNAL_CRON_TOKEN 시크릿이 없습니다."
            exit 1
          fi
          BASE="${NEWLINK_API_URL%/}"
          HEADER="X-Internal-Token: ${INTERNAL_CRON_TOKEN}"

          RUN_JSON="$(curl -fsS --retry 3 --retry-delay 10 --max-time 120 -X POST \
            -H "${HEADER}" \
            "${BASE}/api/internal/stats/run")"
          echo "run=${RUN_JSON}"

          RUN_ID="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1]).get("runId") or "")' "${RUN_JSON}")"
          if [ -z "${RUN_ID}" ]; then
            echo "POST /run 응답에 runId가 없습니다."
            exit 1
          fi

          MAX_MINUTES=100
          INTERVAL=300
          ELAPSED=0
          STATUS_JSON=""

          while true; do
            sleep "${INTERVAL}"
            ELAPSED=$((ELAPSED + 5))
            STATUS_JSON="$(curl -fsS --retry 3 --retry-delay 10 --max-time 60 \
              -H "${HEADER}" \
              "${BASE}/api/internal/stats/status")"
            echo "elapsed=${ELAPSED}m status=${STATUS_JSON}"

            RESULT="$(python3 -c '
          import json, sys
          s = json.loads(sys.argv[1])
          run_id = sys.argv[2]
          last = s.get("lastRun") or {}
          if last.get("id") != run_id:
              print("wait")
          else:
              print(last.get("status") or "wait")
          ' "${STATUS_JSON}" "${RUN_ID}")"

            if [ "${RESULT}" = "completed" ]; then
              break
            fi
            if [ "${RESULT}" = "interrupted" ]; then
              echo "수집 run ${RUN_ID} 가 서버 재시작으로 중단되었습니다."
              exit 1
            fi
            if [ "${ELAPSED}" -ge "${MAX_MINUTES}" ]; then
              echo "수집이 ${MAX_MINUTES}분 안에 끝나지 않았습니다."
              exit 1
            fi
          done

          python3 -c '
          import json, sys
          s = json.loads(sys.argv[1])
          last = s.get("lastRun") or {}
          print("runId=%s status=%s processed=%s total=%s failed=%s" % (
            last.get("id"), last.get("status"), last.get("processed"), last.get("total"), s.get("failed")))
          ' "${STATUS_JSON}"
