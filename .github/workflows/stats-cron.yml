name: stats-cron

on:
  schedule:
    # UTC → KST +9
    - cron: '5 18 * * *' # KST 03:05 full
    - cron: '5 21 * * *' # KST 06:05 light
    - cron: '5 0 * * *' # KST 09:05 light
    - cron: '5 3 * * *' # KST 12:05 light
    - cron: '5 6 * * *' # KST 15:05 light
    - cron: '5 9 * * *' # KST 18:05 light
    - cron: '5 12 * * *' # KST 21:05 light
    - cron: '5 15 * * *' # KST 00:05 light
    - cron: '5 19 * * 0' # KST 월 04:05 분류대기 AI 재분류 (잠든 무료 서버 깨워서)
  workflow_dispatch:
    inputs:
      mode:
        description: 수집 모드
        required: true
        default: light
        type: choice
        options:
          - light
          - full
          - reclassify

jobs:
  trigger:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: POST /api/internal/stats/run 후 완료까지 대기
        env:
          NEWLINK_API_URL: ${{ secrets.NEWLINK_API_URL }}
          INTERNAL_CRON_TOKEN: ${{ secrets.INTERNAL_CRON_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
          DISPATCH_MODE: ${{ github.event.inputs.mode }}
        run: |
          set -euo pipefail
          if [ -z "${NEWLINK_API_URL}" ] || [ -z "${INTERNAL_CRON_TOKEN}" ]; then
            echo "NEWLINK_API_URL 또는 INTERNAL_CRON_TOKEN 시크릿이 없습니다."
            exit 1
          fi
          BASE="${NEWLINK_API_URL%/}"
          HEADER="X-Internal-Token: ${INTERNAL_CRON_TOKEN}"

          MODE="$(python3 -c '
          import os
          event = os.environ.get("EVENT_NAME") or ""
          schedule = (os.environ.get("SCHEDULE_CRON") or "").strip()
          dispatch = (os.environ.get("DISPATCH_MODE") or "").strip()
          if event == "workflow_dispatch":
              d = dispatch.lower()
              print(d if d in ("full", "reclassify") else "light")
          elif schedule == "5 19 * * 0":
              print("reclassify")
          elif schedule == "5 18 * * *":
              print("full")
          else:
              print("light")
          ')"
          echo "mode=${MODE}"

          if [ "${MODE}" = "reclassify" ]; then
            curl -fsS --retry 5 --retry-delay 20 --max-time 120 -X POST \
              -H "${HEADER}" "${BASE}/api/internal/stats/reclassify"
            echo
            for i in $(seq 1 30); do
              sleep 120
              R="$(curl -fsS --retry 3 --retry-delay 10 --max-time 60 \
                -H "${HEADER}" "${BASE}/api/internal/stats/reclassify")"
              echo "elapsed=$((i * 2))m ${R}"
              if echo "${R}" | grep -q '"running":false'; then
                if echo "${R}" | grep -q '"error":null'; then exit 0; fi
                exit 1
              fi
            done
            echo "재분류가 60분 안에 끝나지 않았습니다."
            exit 1
          fi
          if [ "${MODE}" = "light" ]; then
            MAX_MINUTES=35
          else
            MAX_MINUTES=110
          fi

          HTTP_CODE="$(curl -sS --retry 3 --retry-delay 10 --max-time 120 \
            -o /tmp/stats-run.json -w "%{http_code}" -X POST \
            -H "${HEADER}" \
            "${BASE}/api/internal/stats/run?mode=${MODE}")"
          RUN_JSON="$(cat /tmp/stats-run.json)"
          echo "http=${HTTP_CODE} run=${RUN_JSON}"

          SKIPPED="$(python3 -c 'import json,sys
          try:
            d=json.loads(sys.argv[1])
          except Exception:
            d={}
          print("true" if d.get("skipped") else "false")' "${RUN_JSON}")"
          if [ "${HTTP_CODE}" = "409" ] || [ "${SKIPPED}" = "true" ]; then
            echo "light 수집을 건너뛰었습니다 (다른 run 진행 중)."
            exit 0
          fi
          if [ "${HTTP_CODE}" != "202" ] && [ "${HTTP_CODE}" != "200" ]; then
            echo "POST /run 이 ${HTTP_CODE} 를 반환했습니다."
            exit 1
          fi

          RUN_ID="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1]).get("runId") or "")' "${RUN_JSON}")"
          if [ -z "${RUN_ID}" ]; then
            echo "POST /run 응답에 runId가 없습니다."
            exit 1
          fi

          INTERVAL=300
          ELAPSED=0
          STATUS_JSON=""

          while true; do
            sleep "${INTERVAL}"
            ELAPSED=$((ELAPSED + 5))
            STATUS_JSON="$(curl -fsS --retry 3 --retry-delay 10 --max-time 60 \
              -H "${HEADER}" \
              "${BASE}/api/internal/stats/status")"
            echo "elapsed=${ELAPSED}m status=${STATUS_JSON}"

            RESULT="$(python3 -c '
          import json, sys
          s = json.loads(sys.argv[1])
          run_id = sys.argv[2]
          last = s.get("lastRun") or {}
          if last.get("id") != run_id:
              print("wait")
          else:
              print(last.get("status") or "wait")
          ' "${STATUS_JSON}" "${RUN_ID}")"

            if [ "${RESULT}" = "completed" ]; then
              break
            fi
            if [ "${RESULT}" = "interrupted" ]; then
              echo "수집 run ${RUN_ID} 가 서버 재시작으로 중단되었습니다."
              exit 1
            fi
            if [ "${ELAPSED}" -ge "${MAX_MINUTES}" ]; then
              echo "수집이 ${MAX_MINUTES}분 안에 끝나지 않았습니다."
              exit 1
            fi
          done

          python3 -c '
          import json, sys
          s = json.loads(sys.argv[1])
          last = s.get("lastRun") or {}
          print("runId=%s status=%s processed=%s total=%s failed=%s" % (
            last.get("id"), last.get("status"), last.get("processed"), last.get("total"), s.get("failed")))
          ' "${STATUS_JSON}"
