<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/tonconnect-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#eef0f4" />
    <title>NEWLINK</title>
    <script>
      (function () {
        try {
          localStorage.removeItem('newlink-theme');
          var t = localStorage.getItem('newlink-theme-v2') === 'dark' ? 'dark' : 'light';
          document.documentElement.classList.remove('dark', 'light');
          document.documentElement.classList.add(t);
          document.documentElement.dataset.theme = t;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', t === 'dark' ? '#101218' : '#eef0f4');
        } catch (e) {
          document.documentElement.classList.add('light');
        }
      })();
    </script>
    <!-- deploy-bump: 2026-08-09-eod -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
