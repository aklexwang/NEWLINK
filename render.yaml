# NEWLINK — Render 배포 (무료 티어로 먼저 올리기)
# 주의: Free Web은 약 15분 미사용 시 잠들었다가 첫 요청에 늦게 깨어납니다.
# 상시 가동이 필요하면 plan을 starter / basic-256mb 로 올리고 카드를 등록하세요.

databases:
  - name: newlink-db
    plan: free
    databaseName: newlink
    user: newlink
    region: oregon

services:
  - type: web
    name: newlink-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    # production 빌드에서도 nest/typescript(devDependency)가 필요합니다.
    buildCommand: NPM_CONFIG_PRODUCTION=false npm ci && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TYPEORM_SYNC
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: newlink-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 30d
      - key: DEV_ADMIN_BYPASS
        value: "false"
      - key: ADMIN_ACCESS_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ADMIN_IDS
        sync: false
      - key: TELEGRAM_PAYMENT_PROVIDER_TOKEN
        value: "unused"
      - key: PROMOTION_PRICE_TON
        value: "1000000000"
      - key: PROMOTION_DURATION_DAYS
        value: "7"
      - key: SERPER_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: TGSTAT_API_TOKEN
        sync: false
      - key: TGSTAT_LANGUAGE
        value: korean
