# NEWLINK — Render 배포 (유료: Web Starter 0.5 CPU·512MB / DB Basic-256mb·1GB, 2026-10 기준)
# 서버가 잠들지 않으므로 서버 안 크론(light 3시간·full 03:05·분류대기 05:20)이 직접 돈다.
# GitHub Actions(stats-cron)도 같은 시각에 깨우지만 겹치면 한 번만 돈다.
#
# DB 연결: Blueprint의 connectionString 은 내부망 주소입니다.
# ENOTFOUND 가 나면 newlink-db → Info → External Database URL 을
# newlink-api Environment 의 DATABASE_URL 에 직접 넣어 주세요.

databases:
  - name: newlink-db
    plan: basic-256mb
    diskSizeGB: 1
    databaseName: newlink
    user: newlink
    region: oregon

services:
  - type: web
    name: newlink-api
    runtime: node
    plan: starter
    region: oregon
    rootDir: backend
    # NODE_ENV=production 이어도 nest/typescript(devDependency)를 설치해야 빌드됩니다.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUBLIC_SITE_URL
        value: https://global-spay.com
      - key: TYPEORM_SYNC
        value: "false"
      # Blueprint 내부 URL (실패 시 대시보드에서 External URL로 덮어쓰기)
      - key: DATABASE_URL
        fromDatabase:
          name: newlink-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 30d
      - key: DEV_ADMIN_BYPASS
        value: "false"
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ADMIN_IDS
        sync: false
      - key: TELEGRAM_PAYMENT_PROVIDER_TOKEN
        value: "unused"
      - key: PROMOTION_PRICE_TON
        value: "1000000000"
      - key: PROMOTION_DURATION_DAYS
        value: "7"
      - key: SERPER_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: deepseek
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: deepseek-chat
      - key: AI_BASE_URL
        value: https://api.deepseek.com
      - key: AI_DAILY_LIMIT
        value: "300"
      - key: OPENAI_API_KEY
        sync: false
      - key: TGSTAT_API_TOKEN
        sync: false
      - key: TGSTAT_LANGUAGE
        value: korean
      # 예전 무료 서버 시절 설정. 지금은 서버 크론도 돌고 GitHub Actions 도 깨운다.
      - key: STATS_CRON_ENABLED
        value: "false"
      - key: INTERNAL_CRON_TOKEN
        sync: false
      - key: MTPROTO_ENABLED
        value: "false"
      - key: MTPROTO_DAILY_LIMIT
        value: "3000"
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: TELEGRAM_SESSION
        sync: false
